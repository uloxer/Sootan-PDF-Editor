version: '3'
env:
  STIRLING_FLAVOR: core
includes:
  backend:
    taskfile: .taskfiles/backend.yml
    dir: .
  frontend:
    taskfile: .taskfiles/frontend.yml
    dir: frontend
  windows:
    taskfile: .taskfiles/windows.yml
    dir: .
tasks:
  default:
    cmds: [task --list]
  install:
    cmds: [{task: 'frontend:install'}]
  build:
    desc: Build the application
    cmds: [{task: 'backend:build'}]
  check:
    desc: Run all quality gates
    cmds: [{task: 'backend:check'}, {task: 'frontend:check'}]
  test:
    desc: Run all tests
    cmds: [{task: 'backend:test'}, {task: 'frontend:test'}]
  dev:
    desc: Start the local editor and backend
    deps: [backend:dev, frontend:dev]
