services:
  sootan:
    build:
      context: .
      dockerfile: docker/embedded/Dockerfile
    image: sootan-pdf-editor:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sootan-config:/configs
      - sootan-storage:/storage
    environment:
      STIRLING_FLAVOR: core
      SERVER_ADDRESS: 0.0.0.0
volumes:
  sootan-config:
  sootan-storage:
