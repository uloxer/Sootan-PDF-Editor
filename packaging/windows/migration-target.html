<!doctype html><meta charset="utf-8"><title>Sootan migration receiver</title><script>
const databases=new Map();let records=0,digest="";
const fingerprint=async value=>{
 const encode=async x=>{if(x instanceof Blob)return {blob:true,type:x.type,name:x instanceof File?x.name:null,lastModified:x instanceof File?x.lastModified:null,sha256:hex(await crypto.subtle.digest('SHA-256',await x.arrayBuffer())),size:x.size};if(x instanceof ArrayBuffer||ArrayBuffer.isView(x))return {bytes:hex(await crypto.subtle.digest('SHA-256',x instanceof ArrayBuffer?x:x.buffer.slice(x.byteOffset,x.byteOffset+x.byteLength)))};if(x instanceof Date)return {date:x.toISOString()};if(Array.isArray(x))return Promise.all(x.map(encode));if(x&&typeof x==='object'){const r={};for(const k of Object.keys(x).sort())r[k]=await encode(x[k]);return r;}return x;};
 return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(await encode(value)))));
};
const hex=buffer=>[...new Uint8Array(buffer)].map(x=>x.toString(16).padStart(2,'0')).join('');
const read=(db,store,key)=>new Promise((resolve,reject)=>{const req=db.transaction(store).objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
const schema=p=>new Promise((resolve,reject)=>{const req=indexedDB.open(p.name,p.version);req.onupgradeneeded=()=>{const db=req.result;for(const s of p.stores){if(db.objectStoreNames.contains(s.name))continue;const store=db.createObjectStore(s.name,{keyPath:s.keyPath,autoIncrement:s.autoIncrement});for(const i of s.indexes)store.createIndex(i.name,i.keyPath,{unique:i.unique,multiEntry:i.multiEntry});}};req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Close other Sootan windows before migration'));req.onsuccess=()=>{const db=req.result;try{if(db.objectStoreNames.length!==p.stores.length)throw new Error('Destination schema differs');for(const s of p.stores){const store=db.transaction(s.name).objectStore(s.name);if(JSON.stringify(store.keyPath)!==JSON.stringify(s.keyPath)||store.autoIncrement!==s.autoIncrement||store.indexNames.length!==s.indexes.length)throw new Error('Destination schema differs');for(const i of s.indexes){const index=store.index(i.name);if(JSON.stringify(index.keyPath)!==JSON.stringify(i.keyPath)||index.unique!==i.unique||index.multiEntry!==i.multiEntry)throw new Error('Destination index differs');}}databases.set(p.name,db);resolve({});}catch(e){db.close();reject(e);}};});
addEventListener('message',async e=>{
 if(e.origin!==window.__SOOTAN_LEGACY_ORIGIN__||e.source!==parent)return;const {id,action,payload:p}=e.data;
 try{let result={};if(action==='schema')result=await schema(p);
 else if(action==='record'){const db=databases.get(p.database);if(!db)throw new Error('Unknown migration database');const expected=await fingerprint(p.value),existing=await read(db,p.store,p.key);if(existing!==undefined){if(await fingerprint(existing)!==expected)throw new Error('Destination record differs; original and destination retained');}else await new Promise((resolve,reject)=>{const tx=db.transaction(p.store,'readwrite'),store=tx.objectStore(p.store);if(store.keyPath===null)store.add(p.value,p.key);else store.add(p.value);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});if(await fingerprint(await read(db,p.store,p.key))!==expected)throw new Error('Copied record verification failed');records++;digest=hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(digest+expected)));}
 else if(action==='settings'){for(const [key,value] of Object.entries(p)){const old=localStorage.getItem(key);if(old!==null&&old!==value)throw new Error('Destination setting differs; nothing overwritten');}for(const [key,value] of Object.entries(p))localStorage.setItem(key,value);}
 else if(action==='finish'){for(const db of databases.values())db.close();databases.clear();result={records,digest};}
 else throw new Error('Unsupported migration action');parent.postMessage({id,result},e.origin);
 }catch(error){parent.postMessage({id,error:String(error.message||error)},e.origin);}
});
</script>
