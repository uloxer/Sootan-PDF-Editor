version: '3'
tasks:
  build:
    desc: Build the local PDF editor image
    cmds: [docker build -t sootan-pdf-editor -f docker/embedded/Dockerfile .]
  up:
    desc: Start the local PDF editor
    cmds: [docker compose -f compose.yml up -d]
  down:
    desc: Stop the local PDF editor
    cmds: [docker compose -f compose.yml down]
  logs:
    desc: Read local editor logs
    cmds: [docker compose -f compose.yml logs -f]
