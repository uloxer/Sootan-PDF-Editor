dependencies {
    api "org.apache.xmlgraphics:batik-bridge:$batikVersion"
    runtimeOnly "org.apache.xmlgraphics:batik-codec:$batikVersion"
    implementation 'de.rototor.pdfbox:graphics2d:3.0.5'
    api ('technology.tabula:tabula:1.0.5') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation 'org.apache.commons:commons-csv:1.14.1'

    api "com.stirling:stirling-office-convert:$officeConvertVersion"
    implementation "com.stirling:stirling-office-convert-legacy:$officeConvertVersion"
    api "com.stirling:stirling-office-convert-topdf:$officeConvertVersion"
    implementation "com.drewnoakes:metadata-extractor:2.21.0"
    implementation "org.apache.commons:commons-lang3:$commonsLang3"
    implementation "io.github.pixee:java-security-toolkit:1.2.3"
    implementation 'com.google.zxing:core:3.5.4'
    implementation "org.apache.pdfbox:xmpbox:$pdfboxVersion"
    api 'org.verapdf:validation-model:1.30.2'
    implementation 'org.mozilla:rhino:1.7.15'
    api 'tools.jackson.core:jackson-databind:3.1.5'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation "com.fathzer:javaluator:3.0.6"
    api "org.apache.pdfbox:pdfbox:$pdfboxVersion"
    implementation "org.bouncycastle:bcprov-jdk18on:$bouncycastleVersion"
    implementation "org.bouncycastle:bcpkix-jdk18on:$bouncycastleVersion"
}
